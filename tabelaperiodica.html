<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>Tabela Periódica Interativa</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; padding: 20px; }
    .tabela {
      display: grid;
      grid-template-columns: repeat(18, 50px);
      grid-auto-rows: 50px;
      gap: 3px;
    }
    .elemento {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: default;
    }
    .info {
      display: none;
      position: absolute;
      top: 55px; left: -50px;
      width: 180px;
      padding: 6px;
      background: #fff;
      color: #000;
      border: 1px solid #ccc;
      font-size: 12px;
      z-index: 10;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .elemento:hover .info { display: block; }
    .azul-claro { background: #00BCD4; }
    .vermelho { background: #E91E63; }
    .verde { background: #4CAF50; }
    .laranja { background: #FFC107; color: #000; }
    .verde-limao { background: #CDDC39; }
    .roxo { background: #9C27B0; }
    .espaco { background: transparent; pointer-events: none; }
    @media (max-width: 900px) {
      .tabela { grid-template-columns: repeat(18, 30px); grid-auto-rows: 30px; }
      .info { width: 140px; font-size: 10px; top: 35px; }
    }
  </style>
</head>
